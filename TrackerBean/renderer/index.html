<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' cover: media: data: https://*.steamstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'">
<title>TrackerBean</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><i></i>TRACKERBEAN</div>
    <button class="nav on" data-act="nav" data-view="today">Today</button>
    <button class="nav" data-act="nav" data-view="games">Games</button>
    <button class="nav" data-act="nav" data-view="storage">Storage</button>
    <button class="nav" data-act="nav" data-view="stats">Stats</button>
    <button class="nav" data-act="nav" data-view="journal">Journal</button>
    <button class="nav" data-act="nav" data-view="goals">Goals</button>
    <button class="nav" data-act="nav" data-view="profile">Profile</button>
    <button class="nav" data-act="nav" data-view="friends">Friends</button>
    <button class="nav" data-act="nav" data-view="cs2">CS2 Matches</button>
    <button class="nav" data-act="nav" data-view="montage">Montage</button>
    <button class="nav" data-act="nav" data-view="quest">Challenge</button>
    <button class="nav bottom" data-act="nav" data-view="settings">Settings</button>
    <div id="updbox"></div>
    <div class="tray-note"><span class="dot"></span>Tracking in tray</div>
  </aside>
  <main class="main" id="view"></main>
</div>
<script src="app.js"></script>
</body>
</html>
